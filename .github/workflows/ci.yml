name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    name: Lint, type-check, test, build, browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type-check (TypeScript, strict)
        run: npm run typecheck
      - name: Unit, API and accessibility tests (Jest, React Testing Library, jest-axe)
        run: npm test
      - name: Production build (fails if the performance budget is exceeded)
        run: npm run build
      - name: Browser test against the production build
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Static demo build (for GitHub Pages) and its browser test
        run: |
          npm run build:demo
          npm run e2e:demo
      - name: Lighthouse (performance, accessibility, best practices, SEO)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-lighthouse
          path: |
            e2e-shots/
            .lighthouseci/reports/
