name: Publish demo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Static demo build
        run: |
          npm run build:demo
          find dist-demo -name "*.map" -delete
          touch dist-demo/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: dist-demo
        run: |
          git init -q -b gh-pages
          git config user.name "Snehachowdary56"
          git config user.email "snehagunturu@gmail.com"
          git add -A
          git commit -q -m "Publish claims portal demo"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
